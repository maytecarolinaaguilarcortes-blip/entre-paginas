name: Crear APK de Entre Paginas

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto Android
        run: |
          unzip -o EntrePaginasAndroid_proyecto.zip
          test -f EntrePaginasAndroid/app/build.gradle.kts

      - name: Compilar APK
        working-directory: EntrePaginasAndroid
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Entre-Paginas-APK
          path: EntrePaginasAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
